# ---------- NeoForge / Minecraft ----------
# 26.2.0.88 是 NeoForge 的构建号，对应的 Minecraft 版本是 26.2（neoform 26.2-2）
minecraft_version=26.2
neoforge_version=26.2.0.88
moddevgradle_version=2.0.148

# MC 26.2 的 javaVersion.majorVersion = 25，编译与运行都要 JDK 25
java_version=25

# ---------- 模组信息 ----------
mod_version=1.0.0
maven_group=com.dsh
archives_base_name=puppet-neoforge
mod_id=puppet

# ---------- 构建 ----------
# 强制 IPv4：本机 IPv6 到部分镜像不通
# 禁用部分 TLS 套件：中间设备对 ECDHE/X25519 握手会随机卡死
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true "-Djdk.tls.disabledAlgorithms=ECDHE_RSA,ECDHE_ECDSA,RSA,X25519,X25519MLKEM768,MLKEM,TLS_AES_128_CCM_SHA256"
org.gradle.parallel=true
org.gradle.caching=true

# NeoForm 的临时缓存默认落在 ~/.gradle/caches/neoformruntime，
# 本机在该目录建锁文件会被拒绝（AccessDenied），所以改到工程内的 .build-neoform。
neoforged.neoformruntime.cacheDir=.build-neoform
